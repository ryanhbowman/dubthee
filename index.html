<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Dub Thee Back From</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
  <link rel="stylesheet" href="/assets/style.css">
  <script>
    // Restore the real path after a GitHub Pages 404 redirect (see 404.html).
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>
</head>
<body>
  <div class="disco-ball-rig" aria-hidden="true">
    <div class="disco-string"></div>
    <div class="disco-ball">
      <span class="disco-glint g1"></span>
      <span class="disco-glint g2"></span>
      <span class="disco-glint g3"></span>
    </div>
  </div>

  <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>

  <main class="frame">
    <span class="corner corner-tl" aria-hidden="true"></span>
    <span class="corner corner-tr" aria-hidden="true"></span>
    <span class="corner corner-bl" aria-hidden="true"></span>
    <span class="corner corner-br" aria-hidden="true"></span>

    <div class="sword-stage" aria-hidden="true">
      <svg class="sword" viewBox="0 0 40 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#f5f5fa"/>
            <stop offset="45%" stop-color="#d5d9e2"/>
            <stop offset="55%" stop-color="#9aa0ac"/>
            <stop offset="100%" stop-color="#eef0f5"/>
          </linearGradient>
        </defs>
        <polygon points="20,2 25,22 25,64 15,64 15,22" fill="url(#bladeGrad)" stroke="#7d7f8a" stroke-width="0.6"/>
        <line x1="20" y1="6" x2="20" y2="60" stroke="#8b8f99" stroke-width="0.8" opacity="0.7"/>
        <rect x="6" y="63" width="28" height="5" rx="2" fill="#f0c14b" stroke="#b8860b" stroke-width="0.5"/>
        <rect x="17" y="68" width="6" height="19" rx="1.5" fill="#4a2f14"/>
        <circle cx="20" cy="90" r="6" fill="#f0c14b" stroke="#b8860b" stroke-width="0.6"/>
      </svg>
    </div>

    <span class="crown" aria-hidden="true">👑</span>
    <p class="decree">I dub thee back from</p>
    <div id="stage"></div>
  </main>

  <script src="/assets/countries.js"></script>
  <script src="/assets/flagColors.js"></script>
  <script src="/assets/confetti.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/fanfare.js"></script>
</body>
</html>
