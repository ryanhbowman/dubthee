<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect trick (https://github.com/rafgraph/spa-github-pages)
    // Turns /india into /?/india so index.html can restore the real path client-side.
    var segmentCount = 0;
    var l = window.location;
    l.replace(
      l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
      l.pathname.split("/").slice(0, 1 + segmentCount).join("/") + "/?/" +
      l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
      (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
